```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopEase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar-brand {
            font-weight: bold;
            color: #198754 !important;
        }

        .cart-container {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .cart-image {
            width: 85px;
            height: 85px;
            object-fit: cover;
            border-radius: 8px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 5px;
        }

        .summary-box {
            background: white;
            padding: 22px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .checkout-btn {
            width: 100%;
            padding: 12px;
            font-weight: bold;
        }

        .empty-cart {
            padding: 55px 20px;
            text-align: center;
        }

        footer {
            margin-top: 60px;
            background: #212529;
            color: white;
            padding: 25px;
            text-align: center;
        }
    </style>
</head>

<body>

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="index.html">ShopEase</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMenu">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="shop.html">Shop</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="deals.html">Deals</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="about.html">About Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="cart.html">
                        Cart (<span id="cart-count">0</span>)
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Cart Content -->
<div class="container my-5">
    <h2 class="fw-bold mb-2">Shopping Cart</h2>
    <p class="text-muted mb-4">Review your items before checking out.</p>

    <div id="cart-content"></div>
</div>

<!-- Footer -->
<footer>
    <p class="mb-1">&copy; 2026 ShopEase. All rights reserved.</p>
    <small>Your favorite products, all in one place.</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const CART_KEY = "shopease-cart";

    function getCart() {
        try {
            const cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]");
            return Array.isArray(cart) ? cart : [];
        } catch {
            return [];
        }
    }

    function saveCart(cart) {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        updateCartCount();
        renderCart();
    }

    function updateCartCount() {
        const cart = getCart();
        const count = cart.reduce((total, item) =>
            total + (Number(item.quantity) || 0), 0);

        document.getElementById("cart-count").textContent = count;
    }

    function formatPrice(price) {
        return "₱" + Number(price).toLocaleString("en-PH", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });
    }

    function renderCart() {
        const cart = getCart();
        const container = document.getElementById("cart-content");

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="cart-container empty-cart">
                    <h4>Your cart is empty</h4>
                    <p class="text-muted">You haven't added any products yet.</p>
                    <a href="shop.html" class="btn btn-success mt-2">
                        Continue Shopping
                    </a>
                </div>
            `;
            return;
        }

        let subtotal = 0;

        const itemsHTML = cart.map((item, index) => {
            const price = Number(item.price) || 0;
            const quantity = Math.max(1, Number(item.quantity) || 1);
            const itemTotal = price * quantity;

            subtotal += itemTotal;

            return `
                <div class="row align-items-center border-bottom py-3 g-3">
                    <div class="col-12 col-md-6">
                        <div class="d-flex align-items-center gap-3">
                            <img
                                src="${escapeHTML(item.image || "")}"
                                class="cart-image"
                                alt="${escapeHTML(item.name || "Product")}"
                                onerror="this.style.display='none'"
                            >
                            <div>
                                <h6 class="mb-1">${escapeHTML(item.name || "Product")}</h6>
                                <span class="text-muted">${formatPrice(price)}</span>
                            </div>
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="quantity-control">
                            <button onclick="changeQuantity(${index}, -1)"
                                    aria-label="Decrease quantity">−</button>
                            <span>${quantity}</span>
                            <button onclick="changeQuantity(${index}, 1)"
                                    aria-label="Increase quantity">+</button>
                        </div>
                    </div>

                    <div class="col-6 col-md-3 text-md-end">
                        <strong>${formatPrice(itemTotal)}</strong>
                        <br>
                        <button class="btn btn-sm btn-link text-danger p-0 mt-1"
                                onclick="removeItem(${index})">
                            Remove
                        </button>
                    </div>
                </div>
            `;
        }).join("");

        container.innerHTML = `
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="cart-container">
                        ${itemsHTML}
                        <div class="mt-4">
                            <a href="shop.html" class="btn btn-outline-success">
                                Continue Shopping
                            </a>
                            <button class="btn btn-outline-danger ms-2"
                                    onclick="clearCart()">
                                Clear Cart
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="summary-box">
                        <h5 class="fw-bold mb-4">Order Summary</h5>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Subtotal</span>
                            <span>${formatPrice(subtotal)}</span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span>Shipping</span>
                            <span class="text-success">Free</span>
                        </div>

                        <hr>

                        <div class="d-flex justify-content-between mb-4">
                            <strong>Total</strong>
                            <strong class="text-success">${formatPrice(subtotal)}</strong>
                        </div>

                        <button class="btn btn-success checkout-btn"
                                onclick="checkout()">
                            Proceed to Checkout
                        </button>

                        <p class="text-muted small text-center mt-3 mb-0">
                            Demo checkout only. No payment will be processed.
                        </p>
                    </div>
                </div>
            </div>
        `;
    }

    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[character]);
    }

    function changeQuantity(index, change) {
        const cart = getCart();

        if (!cart[index]) return;

        const currentQuantity = Math.max(
            1, Number(cart[index].quantity) || 1
        );
        const newQuantity = currentQuantity + change;

        if (newQuantity < 1) {
            removeItem(index);
            return;
        }

        cart[index].quantity = newQuantity;
        saveCart(cart);
    }

    function removeItem(index) {
        const cart = getCart();
        cart.splice(index, 1);
        saveCart(cart);
    }

    function clearCart() {
        if (confirm("Are you sure you want to clear your cart?")) {
            saveCart([]);
        }
    }

    function checkout() {
        const cart = getCart();

        if (cart.length === 0) {
            alert("Your cart is empty.");
            return;
        }

        alert(
            "Thank you for shopping at ShopEase!\n\n" +
            "This is a demo checkout. Online payment and order processing " +
            "have not been connected."
        );
    }

    updateCartCount();
    renderCart();
</script>

</body>
</html>
